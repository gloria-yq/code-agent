[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-agent"
version = "0.1.0"
description = "A small, from-scratch coding agent with local tools"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "gloria-yq"}]
dependencies = []

[project.scripts]
code-agent = "code_agent.cli:main"

[tool.setuptools.packages.find]
include = ["code_agent*"]

