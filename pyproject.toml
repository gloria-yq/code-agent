[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-agent"
version = "0.2.0"
description = "A small, from-scratch coding agent with local tools"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "gloria-yq"}]
dependencies = [
    "keyring>=25.7,<26",
    "platformdirs>=4.4,<5",
    "textual>=8.2,<9",
]

[project.scripts]
code-agent = "code_agent.cli:main"

[tool.setuptools.packages.find]
include = ["code_agent*"]
